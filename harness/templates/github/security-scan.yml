# Generated by maruda harness.
# Gating policy (shift-left): gitleaks and semgrep block from day one —
# AI-assisted development accumulates debt at implementation speed, so the
# SAST gate must be strong from the start. Manage false positives via
# .semgrepignore (smallest unit only), never by weakening the gate.
# Trivy (dependency CVEs) stays continue-on-error because a finding may have
# no upstream fix yet; remove that line to promote it to a hard gate.
name: Security Scan

on:
  pull_request:
    branches:
{{PR_BASE_BRANCHES}}
  # Direct pushes to the default / integration branch are scanned too
  # (bypass coverage). Feature and epic branches are covered via pull_request.
  push:
    branches:
{{PUSH_BRANCHES}}
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        # Supply chain: verify the downloaded archive with SHA256 before extracting.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz

      - name: Detect secrets
        run: gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml --verbose

  trivy-fs:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy FS scan
        # Staged: fails on CRITICAL/HIGH (exit-code 1) but does not block the PR yet.
        # Remove continue-on-error to promote this to a hard gate.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Semgrep
        # Supply chain: pin the version (never latest).
        run: pip install semgrep==1.162.0

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/security-audit \
            --config p/owasp-top-ten \
{{SEMGREP_LANG_CONFIGS}}
            .
{{NODE_AUDIT_JOB}}
