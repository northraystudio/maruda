# Generated by dev-skills harness. Adjust working-directory per job for monorepos.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
{{PR_BASE_BRANCHES}}
    paths:
{{CI_PATHS}}
      - '.github/workflows/ci.yml'
  # Direct pushes to the default / integration branch are scanned too
  # (bypass coverage). Feature and epic branches are covered via pull_request.
  push:
    branches:
{{PUSH_BRANCHES}}
    paths:
{{CI_PATHS}}
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
{{CI_JOBS}}
