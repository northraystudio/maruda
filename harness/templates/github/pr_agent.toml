# Generated by maruda harness (--pr-agent).
# All PR Agent behaviour lives here — never in workflow env: GitHub Actions
# filters dotted github_action_config.* env vars, and this file is applied on
# both the auto-review and the slash-command path.
# Every key: https://github.com/qodo-ai/pr-agent/blob/main/pr_agent/settings/configuration.toml

[config]
# Bare model key (no "openai/" prefix) so pr-agent's built-in token limit for
# the model applies; a prefixed or unknown name would need custom_model_max_tokens.
model = "gpt-5.3-codex"

[github_action_config]
# On open / reopen / ready_for_review: describe + review + improve.
# auto_describe rewrites the PR body — set it to false to keep human-written
# descriptions and call /describe on demand instead.
auto_review = true
auto_describe = true
auto_improve = true
pr_actions = ["opened", "reopened", "ready_for_review"]
# On every push (synchronize): re-run only /review. Bot and merge commits are
# skipped by pr-agent itself. Listing "synchronize" in pr_actions instead would
# re-run all three tools on every push.
handle_push_trigger = true
push_commands = ["/review"]

[pr_code_suggestions]
# Keep one suggestions comment per PR (updated in place) instead of a new one per run.
persistent_comment = true
