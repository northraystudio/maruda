# Generated by dev-skills harness (--pr-agent).
# Advisory AI review via qodo-ai/pr-agent — never a required status check:
# a missing API secret or a vendor outage must not block merges. Requires the
# OPENAI_KEY repository secret. Behaviour (model, auto review/describe/improve,
# push handling) lives in .pr_agent.toml, not here — GitHub Actions filters
# dotted github_action_config.* env vars, and the toml is applied on both the
# auto-review and the slash-command path.
name: PR Agent

on:
  pull_request:
    # synchronize is kept so pr-agent's push handler (.pr_agent.toml
    # handle_push_trigger / push_commands) can run on new commits.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
{{PR_BASE_BRANCHES}}
  issue_comment:
    types: [created]

# Auto-review runs supersede each other per PR; slash commands never cancel an
# in-flight review (or each other), so each event path gets its own group.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: pr-agent reads the diff via the API (no checkout) and posts
# comments / labels. contents:write is not needed.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: PR Agent (auto review)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo, non-draft PRs only. Under pull_request a fork PR never sees
    # secrets anyway; a collaborator can still review one explicitly with a
    # slash command (the job below) — pr-agent never checks out fork code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Run PR Agent
        uses: qodo-ai/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22 # v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

  slash-command:
    name: PR Agent (slash command)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # /review, /describe, /improve, /ask ... from repository members only.
    # Any leading "/" starts a runner (unknown commands only log a warning) —
    # accepted cost; the author_association allowlist bounds who can spend it.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Run PR Agent
        uses: qodo-ai/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22 # v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
